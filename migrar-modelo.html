<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Migrar Checklist</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background: #f4f6f8;
    }

    .box {
      max-width: 650px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 10px;
    }

    button {
      width: 100%;
      height: 46px;
      border: 0;
      border-radius: 7px;
      background: #163a5f;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #resultado {
      margin-top: 20px;
      white-space: pre-wrap;
      line-height: 1.6;
    }
  </style>
</head>


<body>

<div class="box">

  <h2>
    Migrar modelo do checklist
  </h2>

  <p>
    Esta rotina copiará os locais e itens atuais
    do index.html para o Supabase.
  </p>

  <button id="btn-migrar">
    Iniciar migração
  </button>

  <div id="resultado"></div>

</div>


<script>

const SUPABASE_URL =
  'https://dbleblnwolbbxtscjxif.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_RIq2RdCrwvjvZc7CswobVg_0BlBfRSd';


const resultado =
  document.getElementById(
    'resultado'
  );


function log(texto) {

  resultado.textContent +=
    texto + '\n';
}


// =============================================
// HEADERS
// =============================================

function headers(
  prefer = 'return=representation'
) {

  return {

    apikey:
      SUPABASE_KEY,

    Authorization:
      'Bearer ' +
      SUPABASE_KEY,

    'Content-Type':
      'application/json',

    Prefer:
      prefer
  };
}


// =============================================
// LER INITIALDATA DO INDEX
// =============================================

async function carregarInitialData() {

  const resposta =
    await fetch(
      'index.html?' +
      Date.now()
    );


  if (!resposta.ok) {

    throw new Error(
      'Não foi possível ler index.html.'
    );
  }


  const html =
    await resposta.text();


  const inicioTexto =
    'const initialData = [';


  const inicio =
    html.indexOf(
      inicioTexto
    );


  if (inicio === -1) {

    throw new Error(
      'initialData não encontrado no index.html.'
    );
  }


  const inicioArray =
    inicio +
    inicioTexto.length;


  const fim =
    html.indexOf(
      '];',
      inicioArray
    );


  if (fim === -1) {

    throw new Error(
      'Final do initialData não encontrado.'
    );
  }


  const conteudo =
    html.substring(
      inicioArray,
      fim
    );


  const dados =
    Function(
      '"use strict"; return [' +
      conteudo +
      '];'
    )();


  return dados;
}


// =============================================
// LIMPAR MODELO
// =============================================

async function limparModelo() {

  log(
    'Limpando modelo anterior...'
  );


  let resposta =
    await fetch(
      `${SUPABASE_URL}/rest/v1/checklist_modelo_itens?id=not.is.null`,
      {
        method: 'DELETE',
        headers:
          headers(
            'return=minimal'
          )
      }
    );


  if (!resposta.ok) {

    throw new Error(
      'Erro ao limpar checklist_modelo_itens:\n' +
      await resposta.text()
    );
  }


  resposta =
    await fetch(
      `${SUPABASE_URL}/rest/v1/checklist_locais?id=not.is.null`,
      {
        method: 'DELETE',
        headers:
          headers(
            'return=minimal'
          )
      }
    );


  if (!resposta.ok) {

    throw new Error(
      'Erro ao limpar checklist_locais:\n' +
      await resposta.text()
    );
  }
}


// =============================================
// CRIAR LOCAIS
// =============================================

async function criarLocais(
  dados
) {

  const nomes =
    [
      ...new Set(
        dados.map(
          x => x.setor.trim()
        )
      )
    ];


  nomes.sort(
    (a, b) =>
      a.localeCompare(
        b,
        'pt-BR',
        {
          sensitivity:
            'base'
        }
      )
  );


  const payload =
    nomes.map(
      (nome, indice) => ({

        nome,

        ativo:
          true,

        ordem:
          indice + 1
      })
    );


  const resposta =
    await fetch(
      `${SUPABASE_URL}/rest/v1/checklist_locais`,
      {
        method: 'POST',

        headers:
          headers(),

        body:
          JSON.stringify(
            payload
          )
      }
    );


  const texto =
    await resposta.text();


  if (!resposta.ok) {

    throw new Error(
      'Erro ao criar locais:\n' +
      texto
    );
  }


  return JSON.parse(
    texto
  );
}


// =============================================
// CRIAR ITENS
// =============================================

async function criarItens(
  dados,
  locais
) {

  const mapaLocais =
    new Map();


  locais.forEach(
    local => {

      mapaLocais.set(
        local.nome,
        local.id
      );
    }
  );


  const contadores =
    {};


  const itens =
    dados.map(
      registro => {

        const localNome =
          registro.setor.trim();


        contadores[localNome] =
          (
            contadores[localNome] ||
            0
          ) + 1;


        const localId =
          mapaLocais.get(
            localNome
          );


        if (!localId) {

          throw new Error(
            'Local não encontrado: ' +
            localNome
          );
        }


        return {

          local_id:
            localId,

          item:
            registro.item,

          ativo:
            true,

          ordem:
            contadores[
              localNome
            ]
        };
      }
    );


  // divide em blocos
  // para não mandar tudo
  // numa requisição gigantesca

  const tamanhoLote =
    100;


  for (
    let inicio = 0;
    inicio < itens.length;
    inicio += tamanhoLote
  ) {

    const lote =
      itens.slice(
        inicio,
        inicio + tamanhoLote
      );


    const resposta =
      await fetch(
        `${SUPABASE_URL}/rest/v1/checklist_modelo_itens`,
        {
          method: 'POST',

          headers:
            headers(
              'return=minimal'
            ),

          body:
            JSON.stringify(
              lote
            )
        }
      );


    if (!resposta.ok) {

      throw new Error(
        'Erro ao inserir itens:\n' +
        await resposta.text()
      );
    }


    log(
      `Itens ${inicio + 1} até ` +
      `${Math.min(
        inicio + tamanhoLote,
        itens.length
      )} inseridos.`
    );
  }


  return itens.length;
}


// =============================================
// MIGRAR
// =============================================

async function migrar() {

  const botao =
    document.getElementById(
      'btn-migrar'
    );


  botao.disabled =
    true;


  resultado.textContent =
    '';


  try {

    log(
      'Lendo checklist atual...'
    );


    const dados =
      await carregarInitialData();


    log(
      `${dados.length} itens encontrados.`
    );


    await limparModelo();


    const locais =
      await criarLocais(
        dados
      );


    log(
      `${locais.length} locais criados.`
    );


    const quantidadeItens =
      await criarItens(
        dados,
        locais
      );


    log('');
    log(
      'MIGRAÇÃO CONCLUÍDA.'
    );

    log(
      `${locais.length} locais`
    );

    log(
      `${quantidadeItens} itens`
    );


  } catch (erro) {

    console.error(
      erro
    );


    log('');
    log(
      'ERRO:'
    );

    log(
      erro.message ||
      String(erro)
    );


  } finally {

    botao.disabled =
      false;
  }
}


document
  .getElementById(
    'btn-migrar'
  )
  .addEventListener(
    'click',
    migrar
  );

</script>

</body>
</html>
