<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relatório de Inspeção de Extintores | SST</title>
<style>
*{box-sizing:border-box}body{font:13px Arial,sans-serif;color:#1f2937;margin:0;background:#eef2f6}.toolbar{max-width:1100px;margin:16px auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar a,.toolbar button{background:#163a5f;color:#fff;padding:10px 15px;border:0;border-radius:7px;text-decoration:none;cursor:pointer}.toolbar label{margin-left:auto}.sheet{background:white;max-width:1100px;margin:12px auto 30px;padding:30px 34px;box-shadow:0 3px 20px #0001;min-height:700px}.brand{display:flex;align-items:center;gap:20px;border-bottom:2px solid #163a5f;padding-bottom:15px}.brand img{max-height:75px;max-width:180px;object-fit:contain}.brand h1{font-size:19px;margin:0;color:#163a5f}.brand p{margin:5px 0;color:#64748b}h2{font-size:15px;margin:24px 0 9px;border-bottom:1px solid #163a5f;padding-bottom:5px}table{border-collapse:collapse;width:100%;table-layout:fixed}th{background:#e2e8f0;text-align:left;color:#163a5f}th,td{border-bottom:1px solid #cbd5e1;padding:7px 6px;vertical-align:top;overflow-wrap:anywhere}tr{break-inside:avoid}.meta{display:grid;grid-template-columns:1fr 1fr;gap:7px 20px;margin:18px 0}.nc{color:#a12622;font-weight:700}.photo{display:inline-block;width:31%;vertical-align:top;margin:0 1% 12px 0;break-inside:avoid}.photo img{width:100%;max-height:190px;object-fit:contain}.photo figcaption{font-size:11px}.mapa{width:100%;max-height:480px;object-fit:contain;border:1px solid #ddd}.note{color:#64748b}.footer{margin-top:25px;border-top:1px solid #aaa;padding-top:9px;font-size:11px;color:#64748b}.error{padding:14px;background:#fff1f1;color:#a12622}@media(max-width:700px){.sheet{padding:15px}.meta{grid-template-columns:1fr}.toolbar{padding:10px}.photo{width:48%}}@media print{@page{size:A4;margin:12mm}body{background:white;font-size:10px}.toolbar{display:none}.sheet{box-shadow:none;margin:0;padding:0;max-width:none;min-height:0}h2{break-after:avoid}.brand h1{font-size:16px}th,td{padding:5px 4px}.photo{width:31%}}
</style></head><body>
<div class="toolbar"><a href="inspecao-extintores.html">← Voltar à inspeção</a><button type="button" onclick="window.print()">Imprimir / Salvar PDF</button><label>Data da vistoria <input type="date" id="data" onchange="render()"></label></div>
<main class="sheet" id="relatorio"></main>
<script>
const CHAVE='checklist_extintores_ronda_v1',el=document.getElementById('relatorio'),dataEl=document.getElementById('data');dataEl.value=new Date().toLocaleDateString('en-CA');
const perguntas=['Extintor instalado no local previsto?','Acesso livre e desobstruído?','Sinalização visível e adequada?','Altura e instalação adequadas?','Adequado à classe de incêndio?','Lacre e dispositivo de segurança íntegros?','Manômetro na faixa de operação (quando existente)?','Mangueira, bico e componentes íntegros?','Cilindro sem corrosão, danos ou vazamento aparente?','Rótulo e instruções legíveis?','Etiqueta de manutenção legível?','Manutenção dentro do prazo aplicável?','Identificação e rastreabilidade disponíveis?','Condições gerais adequadas?'];
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dataBR=x=>/^\d{4}-\d\d-\d\d$/.test(x||'')?x.split('-').reverse().join('/'):x||'Não informada';
const numero=i=>'EXT-'+String(i+1).padStart(3,'0');
function render(){
 let d;try{d=JSON.parse(localStorage.getItem(CHAVE))}catch(e){}
 if(!d||!Array.isArray(d.extintores)){el.innerHTML='<p class="error">Nenhuma ronda salva neste navegador. Volte à inspeção e clique em Salvar ronda antes de gerar o relatório.</p>';return}
 const ext=d.extintores,ocorrencias=[];let c=0,p=0;
 ext.forEach((e,i)=>perguntas.forEach((q,j)=>{const status=e.respostas?.[j];if(status==='NC'||status==='P'){ocorrencias.push({e,i,j,q,status,detalhe:e.detalhes?.[j]||e.nc?.[j]||{}});if(status==='NC')c++;else p++}}));
 const linhas=ext.map((e,i)=>'<tr><td>'+numero(i)+'</td><td>'+esc(e.local)+'</td><td>'+esc(e.tipo)+'</td><td>'+esc(e.capacidade)+'</td><td>'+esc(e.serie)+'</td><td>'+esc(dataBR(e.manutencao))+'</td><td class="'+(perguntas.some((_,j)=>e.respostas?.[j]==='NC')?'nc':'')+'">'+(perguntas.some((_,j)=>e.respostas?.[j]==='NC')?'NC':perguntas.some((_,j)=>e.respostas?.[j]==='P')?'P':'Sem NC')+'</td></tr>').join('');
 const quadro=ocorrencias.map((x,k)=>{const det=x.detalhe;return '<tr><td>'+String(k+1).padStart(2,'0')+'</td><td>'+numero(x.i)+' | '+esc(x.e.local)+'</td><td>'+esc(x.q)+'</td><td>'+esc(det.observacao||x.e.observacao||'Não informada')+'</td><td>'+esc(det.recomendacao||det.medida_corretiva||'Não informada')+'</td><td>'+esc(det.responsavel||'Não informado')+'</td></tr>'}).join('');
 const fotos=ocorrencias.flatMap((x,k)=>{const d=x.detalhe;return (Array.isArray(d.fotos)?d.fotos:[]).filter(f=>typeof f==='string'&&f.startsWith('data:image/')).slice(0,3).map((f,i)=>'<figure class="photo"><img src="'+f+'"><figcaption>NC '+(k+1)+' | '+numero(x.i)+' | Foto '+(i+1)+'</figcaption></figure>')}).join('');
 const mapa=(typeof d.mapa_imagem==='string'&&d.mapa_imagem.startsWith('data:image/'))?'<h2>4. Mapa de localização</h2><img class="mapa" src="'+d.mapa_imagem+'" alt="Mapa de localização dos extintores">':'<h2>4. Mapa de localização</h2><p class="note">Planta ou croqui ainda não cadastrado para esta ronda.</p>';
 el.innerHTML='<div class="brand"><div><h1>RELATÓRIO DE INSPEÇÃO DE EXTINTORES | SST</h1><p>Registro de verificação das condições dos extintores</p></div></div><div class="meta"><div><b>Empresa / Fazenda:</b> '+esc(d.empresa||'Não informada')+'</div><div><b>Data da vistoria:</b> '+esc(dataBR(dataEl.value))+'</div><div><b>Extintores verificados:</b> '+ext.length+'</div><div><b>Não conformidades:</b> '+c+' | <b>Pendências:</b> '+p+'</div></div><h2>1. Objetivo</h2><p>Registrar a inspeção visual dos extintores, suas localizações e as condições observadas durante a vistoria.</p><h2>2. Controle de extintores</h2><table><thead><tr><th>Nº</th><th>Local</th><th>Tipo</th><th>Capacidade</th><th>Série</th><th>Manutenção</th><th>Resultado</th></tr></thead><tbody>'+linhas+'</tbody></table><h2>3. Não conformidades e pendências</h2>'+(quadro?'<table><thead><tr><th>Nº</th><th>Extintor / Local</th><th>Item avaliado</th><th>Constatação</th><th>Recomendação</th><th>Responsável</th></tr></thead><tbody>'+quadro+'</tbody></table>':'<p>Nenhuma não conformidade ou pendência registrada.</p>')+mapa+'<h2>5. Registro fotográfico</h2>'+(fotos||'<p class="note">Nenhuma fotografia vinculada às ocorrências.</p>')+'<h2>6. Considerações finais</h2><p>Durante a inspeção foram verificados '+ext.length+' extintor(es), com '+c+' não conformidade(s) e '+p+' pendência(s). As constatações e recomendações estão descritas nos quadros anteriores. A verificação visual não substitui os serviços de inspeção técnica e manutenção aplicáveis.</p><div class="footer">Relatório gerado a partir dos registros da ronda salva no navegador. Conferir as informações antes da emissão.</div>';
}
render();
</script></body></html>
