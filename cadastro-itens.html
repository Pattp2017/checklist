<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Itens</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f6f8;color:#1f2937}.topo{background:#fff;border-bottom:1px solid #d9dee5;padding:16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}.voltar{border:0;background:transparent;font-size:28px;color:#163a5f;cursor:pointer}.topo h1{margin:0;color:#163a5f;font-size:22px}.container{max-width:1000px;margin:0 auto;padding:20px 14px 50px}.barra{display:flex;gap:8px;margin-bottom:14px}.barra input{flex:1}.card{background:#fff;border:1px solid #d9dee5;border-radius:12px;padding:16px;margin-bottom:14px}.lista{display:grid;gap:8px}.linha{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid #d9dee5;border-radius:9px;padding:11px}.linha.inativo{opacity:.58}.nome{font-weight:700;color:#163a5f}.meta{font-size:12px;color:#6b7280;margin-top:3px}.acoes{display:flex;gap:6px;flex-wrap:wrap}.btn,.mini{border:0;border-radius:8px;padding:10px 14px;background:#163a5f;color:#fff;font-weight:700;cursor:pointer}.mini{padding:7px 10px;border:1px solid #d9dee5;background:#fff;color:#163a5f}.mini.perigo{color:#a12622}.msg{display:none;margin-bottom:12px;padding:10px;border-radius:8px}.msg.ok{display:block;background:#ecfdf3;color:#166534}.msg.erro{display:block;background:#fff1f1;color:#b42318}.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modal.aberto{display:flex}.modal-card{width:min(650px,100%);background:#fff;border-radius:14px;padding:18px}.modal-card h2{margin:0 0 14px;color:#163a5f}.campo label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}textarea,input{width:100%;border:1px solid #cbd2d9;border-radius:8px;padding:10px;font:inherit}textarea{min-height:100px;resize:vertical}.modal-acoes{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.sec{background:#e8eef5;color:#163a5f}@media(max-width:650px){.barra{flex-direction:column}.linha{grid-template-columns:1fr}.acoes{justify-content:flex-start}}
  </style>
</head>
<body>
<header class="topo"><button class="voltar" id="voltar" type="button">‹</button><h1>Cadastro de Itens</h1></header>
<main class="container">
  <div id="msg" class="msg"></div>
  <div class="barra"><input id="busca" type="search" placeholder="Buscar item..."><button class="btn" id="novo" type="button">+ Novo item</button></div>
  <div class="card"><div id="lista" class="lista">Carregando...</div></div>
</main>
<div class="modal" id="modal">
  <div class="modal-card">
    <h2 id="titulo-modal">Novo item</h2>
    <div class="campo"><label for="descricao">Descrição *</label><textarea id="descricao" maxlength="600" placeholder="Ex.: Placa de identificação visível e legível?"></textarea></div>
    <div class="modal-acoes"><button class="btn sec" id="cancelar" type="button">Cancelar</button><button class="btn" id="salvar" type="button">Salvar</button></div>
  </div>
</div>
<script>
(() => {
  const SUPABASE_URL='https://dbleblnwolbbxtscjxif.supabase.co';
  const SUPABASE_KEY='sb_publishable_RIq2RdCrwvjvZc7CswobVg_0BlBfRSd';
  const listaEl=document.getElementById('lista'),buscaEl=document.getElementById('busca'),msgEl=document.getElementById('msg'),modal=document.getElementById('modal'),descricaoEl=document.getElementById('descricao');
  let registros=[],editandoId=null;
  function headers(prefer){const h={apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json',Accept:'application/json'};if(prefer)h.Prefer=prefer;return h}
  async function api(path,options={}){const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{...options,headers:{...headers(options.prefer),...(options.headers||{})}});const t=await r.text();if(!r.ok)throw new Error(t||('Erro '+r.status));if(!t)return null;try{return JSON.parse(t)}catch{return t}}
  function norm(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim()}
  function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
  function aviso(txt,tipo='ok'){msgEl.className='msg '+tipo;msgEl.textContent=txt;clearTimeout(aviso.t);aviso.t=setTimeout(()=>{msgEl.className='msg';msgEl.textContent=''},3000)}
  async function carregar(){try{registros=await api('checklist_itens_mestre?select=*&order=ativo.desc,descricao.asc')||[];render()}catch(e){listaEl.textContent='Erro ao carregar itens.';aviso(e.message,'erro')}}
  function render(){const q=norm(buscaEl.value);const arr=registros.filter(x=>!q||norm(x.descricao).includes(q));if(!arr.length){listaEl.innerHTML='<div>Nenhum item encontrado.</div>';return}listaEl.innerHTML=arr.map(x=>`<div class="linha ${x.ativo?'':'inativo'}"><div><div class="nome">${esc(x.descricao)}</div><div class="meta">${x.ativo?'Ativo':'Inativo'}</div></div><div class="acoes"><button class="mini" data-acao="editar" data-id="${x.id}">Editar</button><button class="mini ${x.ativo?'perigo':''}" data-acao="status" data-id="${x.id}">${x.ativo?'Desativar':'Reativar'}</button></div></div>`).join('')}
  function abrirNovo(){editandoId=null;descricaoEl.value='';document.getElementById('titulo-modal').textContent='Novo item';modal.classList.add('aberto');setTimeout(()=>descricaoEl.focus(),50)}
  function abrirEdicao(id){const x=registros.find(r=>r.id===id);if(!x)return;editandoId=id;descricaoEl.value=x.descricao;document.getElementById('titulo-modal').textContent='Editar item';modal.classList.add('aberto');setTimeout(()=>descricaoEl.focus(),50)}
  function fechar(){modal.classList.remove('aberto')}
  async function salvar(){const descricao=descricaoEl.value.trim();if(!descricao){aviso('Informe a descrição do item.','erro');return}const duplicado=registros.some(x=>x.id!==editandoId&&norm(x.descricao)===norm(descricao));if(duplicado){aviso('Já existe um item com essa descrição.','erro');return}const b=document.getElementById('salvar');b.disabled=true;b.textContent='Salvando...';try{if(editandoId){await api(`checklist_itens_mestre?id=eq.${editandoId}`,{method:'PATCH',body:JSON.stringify({descricao,atualizado_em:new Date().toISOString()}),prefer:'return=minimal'})}else{await api('checklist_itens_mestre',{method:'POST',body:JSON.stringify({descricao,ativo:true}),prefer:'return=minimal'})}fechar();await carregar();aviso(editandoId?'Item atualizado.':'Item criado.')}catch(e){aviso('Erro ao salvar: '+e.message,'erro')}finally{b.disabled=false;b.textContent='Salvar'}}
  async function alterarStatus(id){const x=registros.find(r=>r.id===id);if(!x)return;const novo=!x.ativo;if(!novo&&!confirm('Desativar este item?'))return;try{await api(`checklist_itens_mestre?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({ativo:novo,atualizado_em:new Date().toISOString()}),prefer:'return=minimal'});await carregar();aviso(novo?'Item reativado.':'Item desativado.')}catch(e){aviso(e.message,'erro')}}
  document.getElementById('voltar').onclick=()=>location.href='modelos-inspecao.html';document.getElementById('novo').onclick=abrirNovo;document.getElementById('cancelar').onclick=fechar;document.getElementById('salvar').onclick=salvar;buscaEl.oninput=render;modal.addEventListener('click',e=>{if(e.target===modal)fechar()});listaEl.addEventListener('click',e=>{const b=e.target.closest('button[data-acao]');if(!b)return;if(b.dataset.acao==='editar')abrirEdicao(b.dataset.id);if(b.dataset.acao==='status')alterarStatus(b.dataset.id)});carregar();
})();
</script>
</body>
</html>
