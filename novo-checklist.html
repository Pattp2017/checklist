<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Novo Checklist</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f4f6f8;
      color: #1f2937;
    }


    /* =========================================
       CABEÇALHO
    ========================================= */

    .topo {
      background: #ffffff;

      border-bottom:
        1px solid #d9dee5;

      padding:
        18px 20px;

      display: flex;
      align-items: center;

      position: relative;
    }


    .voltar {
      position: absolute;
      left: 18px;

      border: 0;
      background: transparent;

      font-size: 24px;
      color: #163a5f;

      cursor: pointer;

      padding: 5px;
    }


    .topo h1 {
      width: 100%;

      margin: 0;

      text-align: center;

      font-size: 22px;
      color: #163a5f;
    }


    /* =========================================
       CONTAINER
    ========================================= */

    .container {
      width: 100%;
      max-width: 600px;

      margin: 0 auto;

      padding:
        28px 18px;
    }


    /* =========================================
       CARD
    ========================================= */

    .card {
      background: #ffffff;

      border:
        1px solid #d9dee5;

      border-radius: 12px;

      padding: 22px;
    }


    /* =========================================
       CAMPOS
    ========================================= */

    .campo {
      margin-bottom: 18px;
    }


    .campo:last-of-type {
      margin-bottom: 0;
    }


    label {
      display: block;

      margin-bottom: 6px;

      font-size: 14px;
      font-weight: 600;

      color: #374151;
    }


    input,
    select {
      width: 100%;
      height: 44px;

      padding:
        0 12px;

      border:
        1px solid #cbd2d9;

      border-radius: 7px;

      background: #ffffff;

      color: #1f2937;

      font-family: inherit;
      font-size: 15px;

      outline: none;
    }


    input:focus,
    select:focus {
      border-color: #0b6aa6;
    }


    input[readonly] {
      background: #f3f4f6;
      color: #4b5563;
    }


    /* =========================================
       BOTÃO
    ========================================= */

    .acoes {
      margin-top: 24px;
    }


    .btn-iniciar {
      width: 100%;
      height: 46px;

      border: 0;
      border-radius: 7px;

      background: #163a5f;
      color: #ffffff;

      font-family: inherit;
      font-size: 16px;
      font-weight: 600;

      cursor: pointer;
    }


    .btn-iniciar:active {
      transform: scale(.99);
    }


    .btn-iniciar:disabled {
      opacity: .6;
      cursor: not-allowed;
    }


    /* =========================================
       MENSAGEM
    ========================================= */

    .mensagem {
      display: none;

      margin-top: 14px;

      padding: 10px 12px;

      border-radius: 7px;

      font-size: 14px;
    }


    .mensagem.erro {
      display: block;

      background: #fff1f1;
      color: #b42318;

      border:
        1px solid #f4b4b4;
    }


    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 480px) {

      .container {
        padding:
          20px 14px;
      }


      .card {
        padding:
          18px 15px;
      }


      .topo h1 {
        font-size: 20px;
      }

    }

  </style>

</head>


<body>


  <!-- ========================================
       CABEÇALHO
  ========================================= -->

  <header class="topo">

    <button
      type="button"
      class="voltar"
      id="btn-voltar"
      aria-label="Voltar"
    >
      ‹
    </button>

    <h1>
      Novo Checklist
    </h1>

  </header>



  <!-- ========================================
       CONTEÚDO
  ========================================= -->

  <main class="container">

    <section class="card">


      <!-- EMPRESA -->

    <div class="campo campo-empresa">
    
      <label for="empresa-busca">
        Empresa / Fazenda
      </label>
    
      <input
        type="text"
        id="empresa-busca"
        placeholder="Digite o nome da empresa..."
        autocomplete="off"
      >
    
      <input
        type="hidden"
        id="empresa-id"
      >
    
      <div
        id="empresa-sugestoes"
        class="empresa-sugestoes"
      ></div>
    
    </div>



      <!-- RESPONSÁVEL TÉCNICO -->

      <div class="campo">

        <label for="responsavel-tecnico">
          Responsável técnico
        </label>

        <input
          type="text"
          id="responsavel-tecnico"
          autocomplete="off"
        >

      </div>



      <!-- RESPONSÁVEL AUDITORIA -->

      <div class="campo">

        <label for="responsavel-auditoria">
          Responsável pela auditoria
        </label>

        <input
          type="text"
          id="responsavel-auditoria"
          autocomplete="off"
        >

      </div>



      <!-- DATA -->

      <div class="campo">

        <label for="data-auditoria">
          Data da auditoria
        </label>

        <input
          type="date"
          id="data-auditoria"
        >

      </div>



      <!-- HORÁRIO -->

      <div class="campo">

        <label for="horario">
          Horário
        </label>

        <input
          type="text"
          id="horario"
          readonly
        >

      </div>



      <!-- BOTÃO -->

      <div class="acoes">

        <button
          type="button"
          class="btn-iniciar"
          id="btn-iniciar"
        >
          Iniciar Checklist
        </button>

      </div>


      <div
        id="mensagem"
        class="mensagem"
      ></div>


    </section>

  </main>



  <script>

    // =========================================
    // SUPABASE DE EMPRESAS
    // =========================================

    const EMPRESAS_SUPABASE_URL =
      'https://uofnninqxnsvaemxpwhh.supabase.co';

    const EMPRESAS_SUPABASE_KEY =
      'sb_publishable_kCX0kt1EFYYL0sR3zQHDzg_6rLVRJQ8';


    // =========================================
    // ELEMENTOS
    // =========================================

    const empresaSelect =
      document.getElementById(
        'empresa'
      );

    const responsavelTecnicoEl =
      document.getElementById(
        'responsavel-tecnico'
      );

    const responsavelAuditoriaEl =
      document.getElementById(
        'responsavel-auditoria'
      );

    const dataAuditoriaEl =
      document.getElementById(
        'data-auditoria'
      );

    const horarioEl =
      document.getElementById(
        'horario'
      );

    const btnIniciar =
      document.getElementById(
        'btn-iniciar'
      );

    const mensagemEl =
      document.getElementById(
        'mensagem'
      );


    // =========================================
    // VOLTAR
    // =========================================

    document
      .getElementById(
        'btn-voltar'
      )
      .addEventListener(
        'click',
        () => {

          window.location.href =
            'home.html';

        }
      );


    // =========================================
    // DATA ATUAL
    // =========================================

    function preencherDataAtual() {

      const hoje =
        new Date();

      const ano =
        hoje.getFullYear();

      const mes =
        String(
          hoje.getMonth() + 1
        ).padStart(
          2,
          '0'
        );

      const dia =
        String(
          hoje.getDate()
        ).padStart(
          2,
          '0'
        );

      dataAuditoriaEl.value =
        `${ano}-${mes}-${dia}`;
    }


    preencherDataAtual();


    // =========================================
    // HORÁRIO AUTOMÁTICO
    // =========================================

    function preencherHorario() {

      const agora =
        new Date();

      const horas =
        String(
          agora.getHours()
        ).padStart(
          2,
          '0'
        );

      const minutos =
        String(
          agora.getMinutes()
        ).padStart(
          2,
          '0'
        );

      horarioEl.value =
        `${horas}:${minutos}`;
    }


    preencherHorario();


    // =========================================
    // MENSAGEM DE ERRO
    // =========================================

    function mostrarErro(
      texto
    ) {

      mensagemEl.className =
        'mensagem erro';

      mensagemEl.textContent =
        texto;
    }


    function limparMensagem() {

      mensagemEl.className =
        'mensagem';

      mensagemEl.textContent =
        '';
    }


    // =========================================
    // CARREGAR EMPRESAS
    // =========================================

    async function carregarEmpresas() {

      limparMensagem();

      empresaSelect.disabled =
        true;

      empresaSelect.innerHTML =
        '<option value="">Carregando...</option>';


      try {

        const url =
          `${EMPRESAS_SUPABASE_URL}` +
          `/rest/v1/epi_empresas` +
          `?select=id,nome` +
          `&ativo=eq.true` +
          `&order=nome.asc`;


        const resposta =
          await fetch(
            url,
            {
              method: 'GET',

              headers: {

                apikey:
                  EMPRESAS_SUPABASE_KEY,

                Authorization:
                  'Bearer ' +
                  EMPRESAS_SUPABASE_KEY,

                Accept:
                  'application/json'

              }
            }
          );


        const texto =
          await resposta.text();


        if (
          !resposta.ok
        ) {

          throw new Error(
            texto ||
            'Erro ao consultar empresas.'
          );
        }


        const empresas =
          texto
            ? JSON.parse(texto)
            : [];


        empresaSelect.innerHTML =
          '<option value="">Selecione...</option>';


        empresas.forEach(
          empresa => {

            const option =
              document.createElement(
                'option'
              );

            option.value =
              empresa.id;

            option.textContent =
              empresa.nome;

            option.dataset.nome =
              empresa.nome;

            empresaSelect
              .appendChild(
                option
              );
          }
        );


        console.log(
          `${empresas.length} empresa(s) carregada(s).`
        );


        if (
          empresas.length === 0
        ) {

          mostrarErro(
            'Nenhuma empresa ativa encontrada.'
          );
        }


      } catch (erro) {

        console.error(
          'Erro ao carregar empresas:',
          erro
        );


        empresaSelect.innerHTML =
          '<option value="">Erro ao carregar empresas</option>';


        mostrarErro(
          'Não foi possível carregar as empresas.'
        );

      } finally {

        empresaSelect.disabled =
          false;
      }
    }


    carregarEmpresas();


    // =========================================
    // INICIAR CHECKLIST
    // =========================================

    btnIniciar
      .addEventListener(
        'click',
        () => {

          limparMensagem();


          const empresaId =
            empresaSelect.value;


          const empresaNome =
            empresaSelect
              .selectedOptions[0]
              ?.dataset.nome || '';


          const responsavelTecnico =
            responsavelTecnicoEl
              .value
              .trim();


          const responsavelAuditoria =
            responsavelAuditoriaEl
              .value
              .trim();


          const dataAuditoria =
            dataAuditoriaEl.value;


          const horario =
            horarioEl.value;


          // =====================================
          // VALIDAÇÕES
          // =====================================

          if (!empresaId) {

            alert(
              'Selecione a empresa/fazenda.'
            );

            empresaSelect.focus();

            return;
          }


          if (!responsavelAuditoria) {

            alert(
              'Informe o responsável pela auditoria.'
            );

            responsavelAuditoriaEl
              .focus();

            return;
          }


          if (!dataAuditoria) {

            alert(
              'Informe a data da auditoria.'
            );

            dataAuditoriaEl.focus();

            return;
          }


          // =====================================
          // TESTE DOS DADOS
          // =====================================

          console.log(
            'Nova vistoria:',
            {
              empresa_id:
                empresaId,

              empresa_nome:
                empresaNome,

              responsavel_tecnico:
                responsavelTecnico,

              responsavel_auditoria:
                responsavelAuditoria,

              data_auditoria:
                dataAuditoria,

              horario:
                horario,

              status:
                'EM_ANDAMENTO'
            }
          );


          alert(
            'Dados do novo checklist preparados com sucesso.'
          );

        }
      );

  </script>


</body>

</html>
