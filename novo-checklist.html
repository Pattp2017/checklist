<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Novo Checklist</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f4f6f8;
      color: #1f2937;
    }


    /* =========================================
       CABEÇALHO
    ========================================= */

    .topo {
      background: #ffffff;

      border-bottom:
        1px solid #d9dee5;

      padding:
        18px 20px;

      display: flex;
      align-items: center;

      position: relative;
    }


    .voltar {
      position: absolute;
      left: 18px;

      border: 0;
      background: transparent;

      font-size: 24px;
      color: #163a5f;

      cursor: pointer;

      padding: 5px;
    }


    .topo h1 {
      width: 100%;

      margin: 0;

      text-align: center;

      font-size: 22px;
      color: #163a5f;
    }


    /* =========================================
       CONTAINER
    ========================================= */

    .container {
      width: 100%;
      max-width: 600px;

      margin: 0 auto;

      padding:
        28px 18px;
    }


    /* =========================================
       CARD
    ========================================= */

    .card {
      background: #ffffff;

      border:
        1px solid #d9dee5;

      border-radius: 12px;

      padding: 22px;
    }


    /* =========================================
       CAMPOS
    ========================================= */

    .campo {
      margin-bottom: 18px;
    }


    .campo:last-of-type {
      margin-bottom: 0;
    }


    .campo-empresa {
      position: relative;
    }


    label {
      display: block;

      margin-bottom: 6px;

      font-size: 14px;
      font-weight: 600;

      color: #374151;
    }


    input {
      width: 100%;
      height: 44px;

      padding:
        0 12px;

      border:
        1px solid #cbd2d9;

      border-radius: 7px;

      background: #ffffff;

      color: #1f2937;

      font-family: inherit;
      font-size: 15px;

      outline: none;
    }


    input:focus {
      border-color: #0b6aa6;
    }


    input[readonly] {
      background: #f3f4f6;
      color: #4b5563;
    }


    /* =========================================
       AUTOCOMPLETE EMPRESA
    ========================================= */

    .empresa-sugestoes {
      display: none;

      position: absolute;

      left: 0;
      right: 0;

      top: 100%;

      z-index: 1000;

      max-height: 240px;
      overflow-y: auto;

      background: #ffffff;

      border:
        1px solid #cbd2d9;

      border-top: 0;

      border-radius:
        0 0 7px 7px;

      box-shadow:
        0 5px 12px
        rgba(0, 0, 0, .08);
    }


    .empresa-sugestoes.aberto {
      display: block;
    }


    .empresa-opcao {
      padding:
        11px 12px;

      cursor: pointer;

      font-size: 14px;

      border-bottom:
        1px solid #eef1f4;
    }


    .empresa-opcao:last-child {
      border-bottom: 0;
    }


    .empresa-opcao:hover {
      background: #f1f5f9;
    }


    .empresa-sem-resultado {
      padding:
        11px 12px;

      color: #6b7280;

      font-size: 14px;
    }


    /* =========================================
       BOTÃO
    ========================================= */

    .acoes {
      margin-top: 24px;
    }


    .btn-iniciar {
      width: 100%;
      height: 46px;

      border: 0;
      border-radius: 7px;

      background: #163a5f;
      color: #ffffff;

      font-family: inherit;
      font-size: 16px;
      font-weight: 600;

      cursor: pointer;
    }


    .btn-iniciar:active {
      transform: scale(.99);
    }


    .btn-iniciar:disabled {
      opacity: .6;
      cursor: not-allowed;
    }


    /* =========================================
       MENSAGEM
    ========================================= */

    .mensagem {
      display: none;

      margin-top: 14px;

      padding:
        10px 12px;

      border-radius: 7px;

      font-size: 14px;
    }


    .mensagem.erro {
      display: block;

      background: #fff1f1;
      color: #b42318;

      border:
        1px solid #f4b4b4;
    }


    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 480px) {

      .container {
        padding:
          20px 14px;
      }


      .card {
        padding:
          18px 15px;
      }


      .topo h1 {
        font-size: 20px;
      }

    }

  </style>

</head>


<body>


  <!-- ========================================
       CABEÇALHO
  ========================================= -->

  <header class="topo">

    <button
      type="button"
      class="voltar"
      id="btn-voltar"
      aria-label="Voltar"
    >
      ‹
    </button>

    <h1>
      Novo Checklist
    </h1>

  </header>



  <!-- ========================================
       CONTEÚDO
  ========================================= -->

  <main class="container">

    <section class="card">


      <!-- EMPRESA -->

      <div class="campo campo-empresa">

        <label for="empresa-busca">
          Empresa / Fazenda
        </label>

        <input
          type="text"
          id="empresa-busca"
          placeholder="Carregando empresas..."
          autocomplete="off"
        >

        <input
          type="hidden"
          id="empresa-id"
        >

        <div
          id="empresa-sugestoes"
          class="empresa-sugestoes"
        ></div>

      </div>



      <!-- RESPONSÁVEL TÉCNICO -->

      <div class="campo">

        <label for="responsavel-tecnico">
          Responsável técnico
        </label>

        <input
          type="text"
          id="responsavel-tecnico"
          autocomplete="off"
        >

      </div>



      <!-- RESPONSÁVEL AUDITORIA -->

      <div class="campo">

        <label for="responsavel-auditoria">
          Responsável pela auditoria
        </label>

        <input
          type="text"
          id="responsavel-auditoria"
          autocomplete="off"
        >

      </div>



      <!-- DATA -->

      <div class="campo">

        <label for="data-auditoria">
          Data da auditoria
        </label>

        <input
          type="date"
          id="data-auditoria"
        >

      </div>



      <!-- HORÁRIO -->

      <div class="campo">

        <label for="horario">
          Horário
        </label>

        <input
          type="text"
          id="horario"
          readonly
        >

      </div>



      <!-- BOTÃO -->

      <div class="acoes">

        <button
          type="button"
          class="btn-iniciar"
          id="btn-iniciar"
        >
          Iniciar Checklist
        </button>

      </div>


      <div
        id="mensagem"
        class="mensagem"
      ></div>


    </section>

  </main>



  <script>

    // =========================================
    // SUPABASE DE EMPRESAS
    // =========================================

    const EMPRESAS_SUPABASE_URL =
      'https://uofnninqxnsvaemxpwhh.supabase.co';

    const EMPRESAS_SUPABASE_KEY =
      'sb_publishable_kCX0kt1EFYYL0sR3zQHDzg_6rLVRJQ8';


    // =========================================
    // ELEMENTOS
    // =========================================

    const empresaBusca =
      document.getElementById(
        'empresa-busca'
      );

    const empresaIdEl =
      document.getElementById(
        'empresa-id'
      );

    const empresaSugestoes =
      document.getElementById(
        'empresa-sugestoes'
      );

    let empresasCarregadas = [];


    const responsavelTecnicoEl =
      document.getElementById(
        'responsavel-tecnico'
      );

    const responsavelAuditoriaEl =
      document.getElementById(
        'responsavel-auditoria'
      );

    const dataAuditoriaEl =
      document.getElementById(
        'data-auditoria'
      );

    const horarioEl =
      document.getElementById(
        'horario'
      );

    const btnIniciar =
      document.getElementById(
        'btn-iniciar'
      );

    const mensagemEl =
      document.getElementById(
        'mensagem'
      );


    // =========================================
    // VOLTAR
    // =========================================

    document
      .getElementById(
        'btn-voltar'
      )
      .addEventListener(
        'click',
        () => {

          window.location.href =
            'home.html';

        }
      );


    // =========================================
    // DATA ATUAL
    // =========================================

    function preencherDataAtual() {

      const hoje =
        new Date();

      const ano =
        hoje.getFullYear();

      const mes =
        String(
          hoje.getMonth() + 1
        ).padStart(
          2,
          '0'
        );

      const dia =
        String(
          hoje.getDate()
        ).padStart(
          2,
          '0'
        );

      dataAuditoriaEl.value =
        `${ano}-${mes}-${dia}`;
    }


    preencherDataAtual();


    // =========================================
    // HORÁRIO AUTOMÁTICO
    // =========================================

    function preencherHorario() {

      const agora =
        new Date();

      const horas =
        String(
          agora.getHours()
        ).padStart(
          2,
          '0'
        );

      const minutos =
        String(
          agora.getMinutes()
        ).padStart(
          2,
          '0'
        );

      horarioEl.value =
        `${horas}:${minutos}`;
    }


    preencherHorario();


    // =========================================
    // MENSAGENS
    // =========================================

    function mostrarErro(texto) {

      mensagemEl.className =
        'mensagem erro';

      mensagemEl.textContent =
        texto;
    }


    function limparMensagem() {

      mensagemEl.className =
        'mensagem';

      mensagemEl.textContent =
        '';
    }


    // =========================================
    // NORMALIZAR TEXTO
    // =========================================

    function normalizarTexto(texto) {

      return String(
        texto || ''
      )
        .normalize('NFD')
        .replace(
          /[\u0300-\u036f]/g,
          ''
        )
        .toLowerCase()
        .trim();
    }


    // =========================================
    // CARREGAR EMPRESAS
    // =========================================

    async function carregarEmpresas() {

      limparMensagem();

      empresaBusca.disabled =
        true;

      empresaBusca.placeholder =
        'Carregando empresas...';


      try {

        const url =
          `${EMPRESAS_SUPABASE_URL}` +
          `/rest/v1/epi_empresas` +
          `?select=id,nome` +
          `&ativo=eq.true` +
          `&order=nome.asc`;


        const resposta =
          await fetch(
            url,
            {
              method: 'GET',

              headers: {

                apikey:
                  EMPRESAS_SUPABASE_KEY,

                Authorization:
                  'Bearer ' +
                  EMPRESAS_SUPABASE_KEY,

                Accept:
                  'application/json'
              }
            }
          );


        const texto =
          await resposta.text();


        if (!resposta.ok) {

          throw new Error(
            texto ||
            'Erro ao consultar empresas.'
          );
        }


        empresasCarregadas =
          texto
            ? JSON.parse(texto)
            : [];


        empresaBusca.placeholder =
          'Digite o nome da empresa...';


        console.log(
          `${empresasCarregadas.length} empresa(s) carregada(s).`
        );


        if (
          empresasCarregadas.length === 0
        ) {

          mostrarErro(
            'Nenhuma empresa ativa encontrada.'
          );
        }


      } catch (erro) {

        console.error(
          'Erro ao carregar empresas:',
          erro
        );


        empresaBusca.placeholder =
          'Erro ao carregar empresas';


        mostrarErro(
          'Não foi possível carregar as empresas.'
        );

      } finally {

        empresaBusca.disabled =
          false;
      }
    }


    // =========================================
    // MOSTRAR SUGESTÕES
    // =========================================

    function mostrarSugestoesEmpresa() {

      const busca =
        normalizarTexto(
          empresaBusca.value
        );


      // se alterar o texto,
      // invalida seleção anterior
      empresaIdEl.value = '';


      empresaSugestoes.innerHTML =
        '';


      if (!busca) {

        empresaSugestoes
          .classList
          .remove(
            'aberto'
          );

        return;
      }


      const encontradas =
        empresasCarregadas
          .filter(
            empresa =>

              normalizarTexto(
                empresa.nome
              ).includes(
                busca
              )
          )
          .slice(
            0,
            20
          );


      if (
        encontradas.length === 0
      ) {

        const vazio =
          document.createElement(
            'div'
          );

        vazio.className =
          'empresa-sem-resultado';

        vazio.textContent =
          'Nenhuma empresa encontrada.';

        empresaSugestoes
          .appendChild(
            vazio
          );


      } else {

        encontradas.forEach(
          empresa => {

            const opcao =
              document.createElement(
                'div'
              );

            opcao.className =
              'empresa-opcao';

            opcao.textContent =
              empresa.nome;


            opcao.addEventListener(
              'click',
              () => {

                empresaBusca.value =
                  empresa.nome;

                empresaIdEl.value =
                  empresa.id;

                empresaSugestoes
                  .classList
                  .remove(
                    'aberto'
                  );
              }
            );


            empresaSugestoes
              .appendChild(
                opcao
              );
          }
        );
      }


      empresaSugestoes
        .classList
        .add(
          'aberto'
        );
    }


    empresaBusca
      .addEventListener(
        'input',
        mostrarSugestoesEmpresa
      );


    // fecha lista ao clicar fora

    document
      .addEventListener(
        'click',
        evento => {

          if (
            !evento.target.closest(
              '.campo-empresa'
            )
          ) {

            empresaSugestoes
              .classList
              .remove(
                'aberto'
              );
          }
        }
      );


    // =========================================
    // CARREGAR
    // =========================================

    carregarEmpresas();


    // =========================================
    // INICIAR CHECKLIST
    // =========================================

    btnIniciar
      .addEventListener(
        'click',
        () => {

          limparMensagem();


          const empresaId =
            empresaIdEl.value;


          const empresaNome =
            empresaBusca
              .value
              .trim();


          const responsavelTecnico =
            responsavelTecnicoEl
              .value
              .trim();


          const responsavelAuditoria =
            responsavelAuditoriaEl
              .value
              .trim();


          const dataAuditoria =
            dataAuditoriaEl.value;


          const horario =
            horarioEl.value;


          // =====================================
          // VALIDAÇÕES
          // =====================================

          if (!empresaId) {

            alert(
              'Selecione uma empresa válida da lista.'
            );

            empresaBusca.focus();

            return;
          }


          if (!responsavelAuditoria) {

            alert(
              'Informe o responsável pela auditoria.'
            );

            responsavelAuditoriaEl
              .focus();

            return;
          }


          if (!dataAuditoria) {

            alert(
              'Informe a data da auditoria.'
            );

            dataAuditoriaEl.focus();

            return;
          }


          // =====================================
          // TESTE DOS DADOS
          // =====================================

          console.log(
            'Nova vistoria:',
            {

              empresa_id:
                empresaId,

              empresa_nome:
                empresaNome,

              responsavel_tecnico:
                responsavelTecnico,

              responsavel_auditoria:
                responsavelAuditoria,

              data_auditoria:
                dataAuditoria,

              horario:
                horario,

              status:
                'EM_ANDAMENTO'
            }
          );


          alert(
            'Dados do novo checklist preparados com sucesso.'
          );

        }
      );

  </script>


</body>

</html>
