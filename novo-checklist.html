<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novo Checklist</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:#f4f6f8;color:#1f2937}
    .topo{background:#fff;border-bottom:1px solid #d9dee5;padding:18px 20px;display:flex;align-items:center;position:relative}
    .voltar{position:absolute;left:18px;border:0;background:transparent;font-size:24px;color:#163a5f;cursor:pointer;padding:5px}
    .topo h1{width:100%;margin:0;text-align:center;font-size:22px;color:#163a5f}
    .container{width:100%;max-width:600px;margin:0 auto;padding:28px 18px}
    .card{background:#fff;border:1px solid #d9dee5;border-radius:12px;padding:22px}
    .campo{margin-bottom:18px}.campo:last-of-type{margin-bottom:0}.campo-empresa{position:relative}
    label{display:block;margin-bottom:6px;font-size:14px;font-weight:600;color:#374151}
    input,select{width:100%;height:44px;padding:0 12px;border:1px solid #cbd2d9;border-radius:7px;background:#fff;color:#1f2937;font-family:inherit;font-size:15px;outline:none}
    input:focus,select:focus{border-color:#0b6aa6}input[readonly]{background:#f3f4f6;color:#4b5563}
    select:disabled{background:#f3f4f6;color:#6b7280}
    .ajuda{font-size:12px;color:#6b7280;margin-top:5px}
    .empresa-sugestoes{display:none;position:absolute;left:0;right:0;top:100%;z-index:1000;max-height:240px;overflow-y:auto;background:#fff;border:1px solid #cbd2d9;border-top:0;border-radius:0 0 7px 7px;box-shadow:0 5px 12px rgba(0,0,0,.08)}
    .empresa-sugestoes.aberto{display:block}.empresa-opcao{padding:11px 12px;cursor:pointer;font-size:14px;border-bottom:1px solid #eef1f4}.empresa-opcao:last-child{border-bottom:0}.empresa-opcao:hover{background:#f1f5f9}.empresa-sem-resultado{padding:11px 12px;color:#6b7280;font-size:14px}
    .acoes{margin-top:24px}.btn-iniciar{width:100%;height:46px;border:0;border-radius:7px;background:#163a5f;color:#fff;font-family:inherit;font-size:16px;font-weight:600;cursor:pointer}.btn-iniciar:active{transform:scale(.99)}.btn-iniciar:disabled{opacity:.6;cursor:not-allowed}
    .mensagem{display:none;margin-top:14px;padding:10px 12px;border-radius:7px;font-size:14px}.mensagem.erro{display:block;background:#fff1f1;color:#b42318;border:1px solid #f4b4b4}
    @media(max-width:480px){.container{padding:20px 14px}.card{padding:18px 15px}.topo h1{font-size:20px}}
  </style>
</head>
<body>
<header class="topo">
  <button type="button" class="voltar" id="btn-voltar" aria-label="Voltar">‹</button>
  <h1>Novo Checklist</h1>
</header>

<main class="container">
  <section class="card">
    <div class="campo campo-empresa">
      <label for="empresa-busca">Empresa / Fazenda</label>
      <input type="text" id="empresa-busca" placeholder="Carregando empresas..." autocomplete="off">
      <input type="hidden" id="empresa-id">
      <div id="empresa-sugestoes" class="empresa-sugestoes"></div>
    </div>

    <div class="campo">
      <label for="modelo-id">Modelo de inspeção</label>
      <select id="modelo-id" disabled>
        <option value="">Carregando modelos...</option>
      </select>
      <div class="ajuda" id="modelo-ajuda">Selecione o checklist que será aplicado nesta vistoria.</div>
    </div>

    <div class="campo">
      <label for="responsavel-tecnico">Responsável técnico</label>
      <input type="text" id="responsavel-tecnico" autocomplete="off">
    </div>

    <div class="campo">
      <label for="responsavel-auditoria">Responsável pela auditoria</label>
      <input type="text" id="responsavel-auditoria" autocomplete="off">
    </div>

    <div class="campo">
      <label for="data-auditoria">Data da auditoria</label>
      <input type="date" id="data-auditoria">
    </div>

    <div class="campo">
      <label for="horario">Horário</label>
      <input type="text" id="horario" readonly>
    </div>

    <div class="acoes">
      <button type="button" class="btn-iniciar" id="btn-iniciar">Iniciar Checklist</button>
    </div>
    <div id="mensagem" class="mensagem"></div>
  </section>
</main>

<script>
(() => {
  const EMPRESAS_SUPABASE_URL='https://uofnninqxnsvaemxpwhh.supabase.co';
  const EMPRESAS_SUPABASE_KEY='sb_publishable_kCX0kt1EFYYL0sR3zQHDzg_6rLVRJQ8';
  const CHECKLIST_SUPABASE_URL='https://uofnninqxnsvaemxpwhh.supabase.co';
  const CHECKLIST_SUPABASE_KEY='sb_publishable_kCX0kt1EFYYL0sR3zQHDzg_6rLVRJQ8';

  const empresaBusca=document.getElementById('empresa-busca');
  const empresaIdEl=document.getElementById('empresa-id');
  const empresaSugestoes=document.getElementById('empresa-sugestoes');
  const modeloEl=document.getElementById('modelo-id');
  const modeloAjuda=document.getElementById('modelo-ajuda');
  const responsavelTecnicoEl=document.getElementById('responsavel-tecnico');
  const responsavelAuditoriaEl=document.getElementById('responsavel-auditoria');
  const dataAuditoriaEl=document.getElementById('data-auditoria');
  const horarioEl=document.getElementById('horario');
  const btnIniciar=document.getElementById('btn-iniciar');
  const mensagemEl=document.getElementById('mensagem');

  let empresasCarregadas=[];
  let modelosCarregados=[];

  document.getElementById('btn-voltar').onclick=()=>location.href='index.html';

  function checklistHeaders(){
    return {apikey:CHECKLIST_SUPABASE_KEY,Authorization:'Bearer '+CHECKLIST_SUPABASE_KEY,Accept:'application/json','Content-Type':'application/json'};
  }

  function preencherDataAtual(){
    const hoje=new Date();
    const ano=hoje.getFullYear();
    const mes=String(hoje.getMonth()+1).padStart(2,'0');
    const dia=String(hoje.getDate()).padStart(2,'0');
    dataAuditoriaEl.value=`${ano}-${mes}-${dia}`;
  }

  function preencherHorario(){
    const agora=new Date();
    horarioEl.value=`${String(agora.getHours()).padStart(2,'0')}:${String(agora.getMinutes()).padStart(2,'0')}`;
  }

  function mostrarErro(texto){mensagemEl.className='mensagem erro';mensagemEl.textContent=texto}
  function limparMensagem(){mensagemEl.className='mensagem';mensagemEl.textContent=''}
  function normalizarTexto(texto){return String(texto||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}

  async function carregarEmpresas(){
    limparMensagem();
    empresaBusca.disabled=true;
    empresaBusca.placeholder='Carregando empresas...';
    try{
      const url=`${EMPRESAS_SUPABASE_URL}/rest/v1/epi_empresas?select=id,nome&ativo=eq.true&order=nome.asc`;
      const resposta=await fetch(url,{headers:{apikey:EMPRESAS_SUPABASE_KEY,Authorization:'Bearer '+EMPRESAS_SUPABASE_KEY,Accept:'application/json'}});
      const texto=await resposta.text();
      if(!resposta.ok)throw new Error(texto||'Erro ao consultar empresas.');
      empresasCarregadas=texto?JSON.parse(texto):[];
      empresaBusca.placeholder='Digite o nome da empresa...';
      if(!empresasCarregadas.length)mostrarErro('Nenhuma empresa ativa encontrada.');
    }catch(erro){
      console.error('Erro ao carregar empresas:',erro);
      empresaBusca.placeholder='Erro ao carregar empresas';
      mostrarErro('Não foi possível carregar as empresas.');
    }finally{empresaBusca.disabled=false}
  }

  async function carregarModelos(){
    modeloEl.disabled=true;
    modeloEl.innerHTML='<option value="">Carregando modelos...</option>';
    try{
      const resposta=await fetch(`${CHECKLIST_SUPABASE_URL}/rest/v1/checklist_modelos?select=id,nome,descricao,categoria&ativo=eq.true&order=nome.asc`,{headers:checklistHeaders()});
      const texto=await resposta.text();
      if(!resposta.ok)throw new Error(texto||'Erro ao consultar modelos.');
      modelosCarregados=texto?JSON.parse(texto):[];
      modeloEl.innerHTML='<option value="">Selecione um modelo</option>';
      modelosCarregados.forEach(modelo=>{
        const opt=document.createElement('option');
        opt.value=modelo.id;
        opt.textContent=modelo.categoria?`${modelo.nome} · ${modelo.categoria}`:modelo.nome;
        modeloEl.appendChild(opt);
      });
      modeloEl.disabled=false;
      if(!modelosCarregados.length){
        modeloEl.innerHTML='<option value="">Nenhum modelo ativo</option>';
        modeloEl.disabled=true;
        modeloAjuda.textContent='Cadastre ou ative um modelo antes de iniciar uma vistoria.';
      }
    }catch(erro){
      console.error('Erro ao carregar modelos:',erro);
      modeloEl.innerHTML='<option value="">Erro ao carregar modelos</option>';
      modeloAjuda.textContent='Não foi possível consultar os modelos de inspeção.';
      mostrarErro('Não foi possível carregar os modelos de inspeção.');
    }
  }
async function criarSnapshotVistoria(vistoriaId, modeloId) {
  const respostaLocais = await fetch(
    `${CHECKLIST_SUPABASE_URL}/rest/v1/checklist_modelo_locais?modelo_id=eq.${encodeURIComponent(modeloId)}&ativo=eq.true&select=id,nome,ordem,local_mestre_id&order=ordem.asc`,
    { headers: checklistHeaders() }
  );

  const textoLocais = await respostaLocais.text();

  if (!respostaLocais.ok) {
    throw new Error(
      textoLocais || 'Erro ao carregar os locais do modelo.'
    );
  }

  const locais = textoLocais
    ? JSON.parse(textoLocais)
    : [];

  const respostaItens = await fetch(
    `${CHECKLIST_SUPABASE_URL}/rest/v1/checklist_modelo_itens?modelo_id=eq.${encodeURIComponent(modeloId)}&ativo=eq.true&select=id,modelo_local_id,item,ordem,item_mestre_id&order=ordem.asc`,
    { headers: checklistHeaders() }
  );

  const textoItens = await respostaItens.text();

  if (!respostaItens.ok) {
    throw new Error(
      textoItens || 'Erro ao carregar os itens do modelo.'
    );
  }

  const itens = textoItens
    ? JSON.parse(textoItens)
    : [];

  if (!locais.length) {
    throw new Error(
      'O modelo selecionado não possui locais ativos.'
    );
  }

  if (!itens.length) {
    throw new Error(
      'O modelo selecionado não possui itens ativos.'
    );
  }

  const locaisPorId = new Map(
    locais.map(local => [local.id, local])
  );

  const ordemLocal = new Map(
    locais.map((local, indice) => [
      local.id,
      Number.isFinite(Number(local.ordem))
        ? Number(local.ordem)
        : indice
    ])
  );

  const itensOrdenados = [...itens].sort((a, b) => {
    const localA =
      ordemLocal.get(a.modelo_local_id) ?? 999999;

    const localB =
      ordemLocal.get(b.modelo_local_id) ?? 999999;

    if (localA !== localB) {
      return localA - localB;
    }

    return (
      (Number(a.ordem) || 0) -
      (Number(b.ordem) || 0)
    );
  });

  const snapshot = itensOrdenados.map((item, indice) => {
    const local = locaisPorId.get(item.modelo_local_id);

    if (!local) {
      throw new Error(
        `O item "${item.item}" está vinculado a um local inválido.`
      );
    }

    return {
      vistoria_id: vistoriaId,

    item_mestre_id: item.item_mestre_id || null,
    local_id: local.local_mestre_id || null,

      local_nome_snapshot: local.nome,
      item_descricao_snapshot: item.item,

      status: 'C',
      observacao: null,

      responsavel_nc: null,
      data_nc: null,

      ordem: indice + 1,

      foto_path: null,
      arquivar_foto: false
    };
  });

  const respostaSnapshot = await fetch(
    `${CHECKLIST_SUPABASE_URL}/rest/v1/checklist_vistoria_itens`,
    {
      method: 'POST',

      headers: {
        ...checklistHeaders(),
        Prefer: 'return=minimal'
      },

      body: JSON.stringify(snapshot)
    }
  );

  const textoSnapshot =
    await respostaSnapshot.text();

  if (!respostaSnapshot.ok) {
    throw new Error(
      textoSnapshot ||
      'Erro ao criar a cópia do checklist para a vistoria.'
    );
  }
}


async function excluirVistoriaIncompleta(vistoriaId) {
  try {
    await fetch(
      `${CHECKLIST_SUPABASE_URL}/rest/v1/checklist_vistorias?id=eq.${encodeURIComponent(vistoriaId)}`,
      {
        method: 'DELETE',

        headers: {
          ...checklistHeaders(),
          Prefer: 'return=minimal'
        }
      }
    );

  } catch (erro) {
    console.warn(
      'Não foi possível remover a vistoria criada sem snapshot:',
      erro
    );
  }
}
  function mostrarSugestoesEmpresa(){
    const busca=normalizarTexto(empresaBusca.value);
    empresaIdEl.value='';
    empresaSugestoes.innerHTML='';
    if(!busca){empresaSugestoes.classList.remove('aberto');return}
    const encontradas=empresasCarregadas.filter(empresa=>normalizarTexto(empresa.nome).includes(busca)).slice(0,20);
    if(!encontradas.length){
      const vazio=document.createElement('div');
      vazio.className='empresa-sem-resultado';
      vazio.textContent='Nenhuma empresa encontrada.';
      empresaSugestoes.appendChild(vazio);
    }else{
      encontradas.forEach(empresa=>{
        const opcao=document.createElement('div');
        opcao.className='empresa-opcao';
        opcao.textContent=empresa.nome;
        opcao.onclick=()=>{empresaBusca.value=empresa.nome;empresaIdEl.value=empresa.id;empresaSugestoes.classList.remove('aberto')};
        empresaSugestoes.appendChild(opcao);
      });
    }
    empresaSugestoes.classList.add('aberto');
  }

  empresaBusca.addEventListener('input',mostrarSugestoesEmpresa);
  document.addEventListener('click',evento=>{if(!evento.target.closest('.campo-empresa'))empresaSugestoes.classList.remove('aberto')});

  btnIniciar.addEventListener('click',async()=>{
    limparMensagem();
    const empresaId=empresaIdEl.value;
    const empresaNome=empresaBusca.value.trim();
    const modeloId=modeloEl.value;
    const modelo=modelosCarregados.find(m=>m.id===modeloId);
    const responsavelTecnico=responsavelTecnicoEl.value.trim();
    const responsavelAuditoria=responsavelAuditoriaEl.value.trim();
    const dataAuditoria=dataAuditoriaEl.value;
    const horario=horarioEl.value;

    if(!empresaId){alert('Selecione uma empresa válida da lista.');empresaBusca.focus();return}
    if(!modeloId||!modelo){alert('Selecione o modelo de inspeção.');modeloEl.focus();return}
    if(!responsavelAuditoria){alert('Informe o responsável pela auditoria.');responsavelAuditoriaEl.focus();return}
    if(!dataAuditoria){alert('Informe a data da auditoria.');dataAuditoriaEl.focus();return}

      btnIniciar.disabled = true;
      btnIniciar.textContent = 'Iniciando...';
      
      let vistoriaCriadaId = null;
      
      try {
      const dados={
        empresa_id:empresaId,
        empresa_nome:empresaNome,
        modelo_id:modelo.id,
        modelo_nome:modelo.nome,
        responsavel_tecnico:responsavelTecnico||null,
        responsavel_auditoria:responsavelAuditoria,
        data_auditoria:dataAuditoria,
        horario,
        status:'EM_ANDAMENTO'
      };

      const resposta=await fetch(`${CHECKLIST_SUPABASE_URL}/rest/v1/checklist_vistorias`,{
        method:'POST',headers:{...checklistHeaders(),Prefer:'return=representation'},body:JSON.stringify(dados)
      });
      const texto=await resposta.text();
      if(!resposta.ok)throw new Error(texto||'Erro ao criar checklist.');
      const registros=JSON.parse(texto);
      if(!registros?.[0]?.id)throw new Error('O banco não retornou o ID da vistoria.');
     const vistoria = registros[0];

vistoriaCriadaId = vistoria.id;

await criarSnapshotVistoria(
  vistoria.id,
  modelo.id
);

localStorage.setItem('checklist_vistoria_id', vistoria.id);
localStorage.setItem('checklist_nova_vistoria', 'true');
localStorage.setItem('checklist_modelo_id', modelo.id);
localStorage.setItem('checklist_modelo_nome', modelo.nome);

location.href =
  `vistoria.html?vistoria_id=${encodeURIComponent(vistoria.id)}`;

} catch (erro) {

  if (vistoriaCriadaId) {
    await excluirVistoriaIncompleta(
      vistoriaCriadaId
    );
  }

  console.error(
    'Erro ao iniciar checklist:',
    erro
  );

  console.error(
    'Erro ao iniciar checklist:',
    erro
  );

  alert(
    'Não foi possível iniciar o checklist.\n\n' +
    (erro?.message || String(erro))
  );

} finally {
      btnIniciar.disabled=false;
      btnIniciar.textContent='Iniciar Checklist';
    }
  });

  preencherDataAtual();
  preencherHorario();
  carregarEmpresas();
  carregarModelos();
})();
</script>
</body>
</html>
