<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Checklist de Auditoria</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f4f6f8;

      color: #1f2937;
    }


    /* =========================================
       CABEÇALHO
    ========================================= */

    .topo {

      background: #ffffff;

      border-bottom:
        1px solid #d9dee5;

      padding:
        18px 20px;

      text-align: center;
    }


    .topo h1 {

      margin: 0;

      font-size: 22px;

      color: #163a5f;
    }


    .topo p {

      margin:
        5px 0 0;

      font-size: 14px;

      color: #6b7280;
    }


    /* =========================================
       CONTEÚDO
    ========================================= */

    .container {

      width: 100%;

      max-width: 600px;

      margin:
        0 auto;

      padding:
        35px 18px;
    }


    .titulo {

      margin-bottom:
        22px;
    }


    .titulo h2 {

      margin:
        0 0 6px;

      font-size:
        21px;
    }


    .titulo p {

      margin: 0;

      color: #6b7280;

      font-size:
        14px;

      line-height:
        1.5;
    }


    /* =========================================
       OPÇÕES
    ========================================= */

    .menu {

      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 14px;
    }


    .menu-card {

      min-height:
        150px;

      border:
        1px solid #d9dee5;

      border-radius:
        12px;

      background:
        #ffffff;

      padding:
        22px 16px;

      display: flex;

      flex-direction:
        column;

      align-items:
        center;

      justify-content:
        center;

      text-align:
        center;

      cursor:
        pointer;

      text-decoration:
        none;

      color:
        #1f2937;

      transition:
        transform .15s ease,
        box-shadow .15s ease;
    }


    .menu-card:active {

      transform:
        scale(.98);
    }


    .menu-card:hover {

      box-shadow:
        0 5px 16px
        rgba(0, 0, 0, .08);
    }


    .menu-icon {

      font-size:
        38px;

      margin-bottom:
        12px;
    }


    .menu-card strong {

      display:
        block;

      font-size:
        17px;

      color:
        #163a5f;

      margin-bottom:
        6px;
    }


    .menu-card span {

      font-size:
        13px;

      color:
        #6b7280;

      line-height:
        1.4;
    }


    /* =========================================
       MOBILE
    ========================================= */

    @media
    (max-width: 480px) {

      .container {

        padding:
          28px 16px;
      }


      .menu {

        grid-template-columns:
          1fr;
      }


      .menu-card {

        min-height:
          125px;
      }
    }

  </style>

</head>


<body>


  <!-- ========================================
       CABEÇALHO
  ========================================= -->

  <header class="topo">

    <h1>
      Checklist de Auditoria
    </h1>

    <p>
      RG Certe SST
    </p>

  </header>



  <!-- ========================================
       CONTEÚDO
  ========================================= -->

  <main class="container">


    <section class="titulo">

      <h2>
        Início
      </h2>

      <p>
        Selecione uma opção para continuar.
      </p>

    </section>



    <section class="menu">


      <!-- NOVO CHECKLIST -->

      <a
        href="novo-checklist.html"
        class="menu-card"
      >

        <div class="menu-icon">
          ➕
        </div>

        <strong>
          Novo Checklist
        </strong>

        <span>
          Iniciar uma nova vistoria
        </span>

      </a>



      <!-- CHECKLISTS -->

      <a
        href="checklists.html"
        class="menu-card"
      >

        <div class="menu-icon">
          📋
        </div>

        <strong>
          Checklists
        </strong>

        <span>
          Consultar e continuar vistorias
        </span>

      </a>


    </section>


  </main>


</body>

</html>
