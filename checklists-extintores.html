<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checklists de Extintores</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#1f2937;font:14px Arial,sans-serif}header{background:white;border-bottom:1px solid #d9dee5;padding:20px;text-align:center}h1{margin:0;font-size:22px;color:#163a5f}main{max-width:1150px;margin:25px auto;padding:0 16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}a.button,button{background:#163a5f;color:white;border:0;border-radius:7px;padding:10px 13px;text-decoration:none;cursor:pointer;font-weight:600}.filtros{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.filtros input,.filtros select{border:1px solid #d9dee5;border-radius:8px;padding:11px;font:inherit;min-width:210px}table{width:100%;border-collapse:collapse;background:white;border:1px solid #d9dee5;border-radius:10px}th,td{text-align:left;padding:13px;border-bottom:1px solid #edf0f3}th{background:#f8fafc;color:#475569;font-size:12px}.actions{display:flex;gap:7px}.actions button{font-size:12px}.muted{color:#64748b}.status{padding:6px 9px;border-radius:20px;background:#fff3d8;color:#8a5b00;font-weight:700;font-size:12px}.status.ok{background:#dcfce7;color:#166534}.card{background:white;border:1px solid #d9dee5;border-radius:10px;padding:16px;margin:12px 0}.mobile{display:none}#mensagem{margin:16px 0}@media(max-width:750px){table{display:none}.mobile{display:block}.top{align-items:flex-start}.filtros input,.filtros select{width:100%}}</style></head><body><header><h1>Checklists de Extintores</h1></header><main><div class="top"><div><a href="index.html">← Menu</a><h2>Gestão de inspeções</h2><p class="muted">Consulte clientes com rondas de extintores e abra relatórios.</p></div><a class="button" href="inspecao-extintores.html">+ Nova inspeção</a></div><div class="filtros"><input id="busca" placeholder="Buscar empresa / fazenda"><select id="status"><option value="todos">Todos</option><option value="nc">Com não conformidade</option><option value="ok">Sem não conformidade</option></select><button id="atualizar">Atualizar</button></div><p id="mensagem" class="muted">Carregando histórico...</p><table><thead><tr><th>Empresa / Fazenda</th><th>Data da inspeção</th><th>Extintores</th><th>NCs</th><th>Situação</th><th>Ações</th></tr></thead><tbody id="linhas"></tbody></table><div class="mobile" id="cards"></div></main><script>
const SUPA='https://uofnninqxnsvaemxpwhh.supabase.co',KEY='sb_publishable_kCX0kt1EFYYL0sR3zQHDzg_6rLVRJQ8',AUTH='checklist_extintores_auth_v1',CACHE='checklist_extintores_ronda_v1';let registros=[];const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dataBR(s){return s?new Date(s).toLocaleDateString('pt-BR'):'-'}
function resumo(r){const ex=r.dados?.extintores||[];let nc=0;ex.forEach(e=>Object.values(e.respostas||{}).forEach(v=>{if(v==='NC')nc++}));return {ext:ex.length,nc}}
function abrir(r,relatorio=false){try{localStorage.setItem(CACHE,JSON.stringify({...r.dados,ronda_id:r.id}));location.href=relatorio?'relatorio-extintores.html':'inspecao-extintores.html'}catch(e){$('mensagem').textContent='Não foi possível abrir: '+e.message}}
function render(){const q=$('busca').value.toLocaleLowerCase('pt-BR'),st=$('status').value;const filtrados=registros.filter(r=>{const z=resumo(r);return (r.empresa_nome||'').toLocaleLowerCase('pt-BR').includes(q)&&(st==='todos'||(st==='nc'?z.nc>0:z.nc===0))});$('linhas').innerHTML='';$('cards').innerHTML='';filtrados.forEach(r=>{const z=resumo(r),status=z.nc?'<span class="status">'+z.nc+' NC(s)</span>':'<span class="status ok">Sem NC</span>';const tr=document.createElement('tr');tr.innerHTML='<td><b>'+esc(r.empresa_nome)+'</b></td><td>'+dataBR(r.data_inspecao)+'</td><td>'+z.ext+'</td><td>'+z.nc+'</td><td>'+status+'</td><td class="actions"></td>';const td=tr.lastElementChild;const card=document.createElement('div');card.className='card';card.innerHTML='<b>'+esc(r.empresa_nome)+'</b><p>'+dataBR(r.data_inspecao)+' | '+z.ext+' extintor(es) | '+z.nc+' NC(s)</p><div class="actions"></div>';for(const parent of [td,card.querySelector('.actions')]){const a=document.createElement('button');a.textContent='Abrir';a.onclick=()=>abrir(r);const b=document.createElement('button');b.textContent='Relatório';b.onclick=()=>abrir(r,true);parent.append(a,b)}$('linhas').append(tr);$('cards').append(card)});$('mensagem').textContent=filtrados.length+' ronda(s) encontrada(s).'}
async function carregar(){let sessao;try{sessao=JSON.parse(localStorage.getItem(AUTH)||'null')}catch(e){}if(!sessao?.access_token){$('mensagem').textContent='Nenhuma sessão conectada neste navegador. Abra Inspeção de Extintores e clique em Conectar ao banco.';return}try{const resp=await fetch(SUPA+'/rest/v1/checklist_extintores_rondas?select=id,empresa_nome,data_inspecao,dados&order=data_inspecao.desc&limit=500',{headers:{apikey:KEY,Authorization:'Bearer '+sessao.access_token}});if(!resp.ok)throw Error('HTTP '+resp.status);registros=await resp.json();render()}catch(e){$('mensagem').textContent='Não foi possível consultar o banco: '+e.message}}
$('busca').oninput=render;$('status').onchange=render;$('atualizar').onclick=carregar;carregar();
</script></body></html>
